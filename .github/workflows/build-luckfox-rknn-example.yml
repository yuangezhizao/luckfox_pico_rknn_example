name: 构建 Luckfox Pico RKNN 例程

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 强制重建 CI 镜像（吸收 apt 安全更新，跳过“已存在则复用”）
        type: boolean
        default: false
  schedule:
    # 北京每月 1 日 08:00（UTC 00:00）自动强制重建 CI 镜像以吸收 apt 安全更新，并用新镜像编译全部变体、运行文档检查
    - cron: '0 0 1 * *'
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - dev

concurrency:
  # group 含 event_name：push / schedule / workflow_dispatch / pull_request 各自独立并发组，
  # 避免月度 schedule 重建与 push(dev) 例程构建跨事件互相取消。
  # 只有 pull_request 取消同组旧 run（只复用镜像、不推送，取消安全）；其余事件排队等前一个跑完：
  # build-image 先推送正式 tag、下一步才签名，在两者之间被取消会留下无 attestation 的 tag，之后 dest-lock 一直失败
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-image:
    name: 🐳 构建 CI 镜像
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write       # actions/attest：Sigstore keyless 签名
      attestations: write   # actions/attest：上传 attestation 到 GH API
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: 📤 检出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🔐 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 构建/复用镜像并输出 digest
        id: build
        shell: bash
        env:
          # schedule（月度）或手动 force_rebuild 时强制重建，吸收 Dockerfile apt 包的安全更新
          FORCE_REBUILD: ${{ github.event_name == 'schedule' || inputs.force_rebuild == true }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # gh attestation verify 需
          EVENT_NAME: ${{ github.event_name }}    # 经 env 传入，避免分支名等直接插入脚本
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 本 job 照搬 luckfox_pico_rkmpi_example 仓 dev cf2a0db 的同名 job（其底为 luckfox_pico_lvgl_example 仓 dev 11497f3）；注释中的「spec D12」「§9」指 lvgl 仓 PR #4 spec：
          # https://github.com/yuangezhizao/luckfox_pico_lvgl_example/blob/11497f3d57d1e74eeade30a07e79a19c0f7f2369/docs/superpowers/specs/2026-09-21-lvgl-example-github-actions-ci-design.md
          # 断言 digest 合法（sha256:<64hex>），否则 fail loud——防 jq 缺键返回字面量 null 静默下传（见 spec D12）
          assert_digest() {  # $1=场景 $2=digest
            [[ "$2" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "❌ ${1}: 非法 digest '${2}'（期望 sha256:<64hex>）——中止（fail loud）"; exit 1; }
          }
          dest_lock_or_die() {
            # 验证 build provenance：signer 与 source 均锁定受保护的 dev 分支——feature 分支签发的 attestation 不被信任，防具写权限者从自有分支 dispatch 签恶意镜像绕过；单次验证、失败即 fail loud（不对瞬时故障重试）
            # 保障边界见 spec D12 / §9：本验证防 registry 层投毒，不含防回滚/新鲜度、不替代 dev 分支治理
            # 用 --format json：CI 非 TTY 下 gh「成功即静默」，唯 --format json 有输出；成功打印 jq 格式化的 verificationResult（完整解析结果：证书身份 + Rekor 时间戳 + statement，无 base64 bundle 噪音）
            if OUT=$(gh attestation verify "oci://${IMAGE_REF}@${DIGEST}" \
              --repo "${{ github.repository }}" \
              --source-ref refs/heads/dev \
              --signer-workflow "${{ github.repository }}/.github/workflows/build-luckfox-rknn-example.yml@refs/heads/dev" \
              --bundle-from-oci --format json 2>&1); then
              echo "✅ provenance 验证通过（signer/source=dev），复用（被验证的 digest 即下游所用）；验证详情："
              echo "${OUT}" | jq '.[].verificationResult' 2>/dev/null || echo "${OUT}"
            else
              # 失败：打印 gh 报错 + 宽松复验（仅 --repo 作信任锚、不绑 signer/source）的完整 verificationResult，打印实际 signer/source 供对比
              echo "❌ 复用镜像 build provenance 强验证（signer/source=dev）未通过——疑似复用投毒或验证服务不可用，拒绝使用并中止（fail loud）。gh 报错："
              echo "${OUT}"
              echo "  ↳ 宽松复验（仅 --repo 作信任锚、不绑 signer/source）该 digest attestation 的完整解析结果（对比实际 signer/source）："
              gh attestation verify "oci://${IMAGE_REF}@${DIGEST}" --repo "${{ github.repository }}" --bundle-from-oci --format json 2>/dev/null \
                | jq '.[].verificationResult' 2>/dev/null \
                || echo "  （未取到 attestation：无签名，或 Sigstore/Rekor/GHCR 暂不可达）"
              exit 1
            fi
          }
          # 正式 tag 只能由 dev 构建并签名：非 dev 分支手动触发时只允许复用，强制重建与首建都在推送前拒绝。
          # 否则 feature 分支签名的镜像会占用与 dev 相同的 Dockerfile 哈希 tag，之后 dev 与 PR 的 dest-lock 一直失败
          require_dev() {  # $1=场景
            [ "${GITHUB_REF}" = "refs/heads/dev" ] || { echo "❌ ${1}：正式镜像只在 dev 上构建并 attest，当前 ref 为 ${GITHUB_REF}——中止，不推送（fail loud）"; exit 1; }
          }
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REF="ghcr.io/${OWNER}/luckfox-rknn-example-ci"
          TAG=$(sha256sum .cursor/Dockerfile | cut -c1-32)
          echo "镜像标签（Dockerfile 内容 hash）= ${TAG}"
          REBUILT=false
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "pull_request：只复用 dev 签名镜像，不构建、不推送"
            if ! INSPECT_OUT=$(docker buildx imagetools inspect "${IMAGE_REF}:${TAG}" 2>&1); then
              echo "❌ 无已存在镜像；可信镜像只在 dev 上构建"
              echo "${INSPECT_OUT}"
              exit 1
            fi
            echo "✅ ${IMAGE_REF}:${TAG} 已存在——先验证 build provenance 再复用（防 GHCR 复用投毒，见 spec D12）"
            DIGEST=$(docker buildx imagetools inspect "${IMAGE_REF}:${TAG}" --format '{{json .Manifest.Digest}}' | xargs) \
              || { echo "❌ 复用: imagetools inspect 取 Manifest.Digest 失败——中止（fail loud）"; exit 1; }
            assert_digest "复用/inspect" "${DIGEST}"
            dest_lock_or_die
            SOURCE="复用（provenance 验证通过）"
          elif [ "${FORCE_REBUILD}" = "true" ]; then
            echo "🔁 强制重建（schedule 月度 / 手动 force_rebuild）：--no-cache 重跑 apt、跳过复用"
            require_dev "force_rebuild"
            # 一步 build+push，digest 取自构建产物（buildx metadata 的 containerimage.digest），绝不再按 mutable tag 二次 inspect——消除 push→inspect 之间被重指 tag 的 TOCTOU（见 spec D12）
            docker buildx build --no-cache --push -f .cursor/Dockerfile -t "${IMAGE_REF}:${TAG}" --metadata-file /tmp/bx-meta.json .cursor
            REBUILT=true
            SOURCE="强制重建（--no-cache）"
            DIGEST=$(jq -er '."containerimage.digest" // empty' /tmp/bx-meta.json) \
              || { echo "❌ force_rebuild: buildx metadata 缺 containerimage.digest——中止（fail loud）"; exit 1; }
            assert_digest "force_rebuild" "${DIGEST}"
          elif INSPECT_OUT=$(docker buildx imagetools inspect "${IMAGE_REF}:${TAG}" 2>&1); then
            echo "✅ ${IMAGE_REF}:${TAG} 已存在——先验证 build provenance 再复用（防 GHCR 复用投毒，见 spec D12）"
            DIGEST=$(docker buildx imagetools inspect "${IMAGE_REF}:${TAG}" --format '{{json .Manifest.Digest}}' | xargs) \
              || { echo "❌ 复用: imagetools inspect 取 Manifest.Digest 失败——中止（fail loud）"; exit 1; }
            assert_digest "复用/inspect" "${DIGEST}"
            dest_lock_or_die
            SOURCE="复用（provenance 验证通过）"
          else
            # inspect 非零：tag 不存在，或 registry 网络/鉴权/5xx 等故障——一律回退可信重建（重建当前 checkout 的 Dockerfile、不放行未验证镜像）；打印 inspect 输出、不静默
            echo "⚠️ imagetools inspect 未成功（tag 不存在，或 registry/网络/鉴权故障），回退到可信重建；inspect 输出如下："
            echo "${INSPECT_OUT}"
            require_dev "首建"
            echo "🔨 构建并推送 ${IMAGE_REF}:${TAG}"
            # 同上：一步 build+push + metadata digest，消除 push→inspect 的 TOCTOU
            docker buildx build --push -f .cursor/Dockerfile -t "${IMAGE_REF}:${TAG}" --metadata-file /tmp/bx-meta.json .cursor
            REBUILT=true
            SOURCE="首建（tag 不存在或 inspect 失败）"
            DIGEST=$(jq -er '."containerimage.digest" // empty' /tmp/bx-meta.json) \
              || { echo "❌ 首建: buildx metadata 缺 containerimage.digest——中止（fail loud）"; exit 1; }
            assert_digest "首建" "${DIGEST}"
          fi
          echo "镜像 digest = ${DIGEST}"
          {
            echo "image=${IMAGE_REF}@${DIGEST}"
            echo "image_name=${IMAGE_REF}"
            echo "digest=${DIGEST}"
            echo "rebuilt=${REBUILT}"
          } >> "$GITHUB_OUTPUT"
          # 写入 run 摘要页，便于从例程 artifact 所在 run 追溯编译用的镜像
          {
            echo "### 🐳 CI 镜像"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 触发事件 | \`${EVENT_NAME}\` |"
            echo "| 分支 | \`${REF_NAME}\` |"
            echo "| 镜像来源 | ${SOURCE} |"
            echo "| 镜像 | \`${IMAGE_REF}@${DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔏 生成 build provenance attestation（仅新建镜像时；复用镜像的 provenance 已在上步验证）
        if: steps.build.outputs.rebuilt == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.build.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-example:
    name: 🛠️ ${{ matrix.title }}
    needs: build-image
    # schedule（月度）也编译：用同一 run 刚重建的镜像，当月即验证新镜像，artifact 也随之刷新
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # 镜像末尾 USER ubuntu（Cloud Agent）；Actions 要求 job 容器为超级用户（官方文档写 root）。用 --user 0（数字 uid）覆盖，不用 --user root（按 passwd 名解析）。https://docs.github.com/en/actions/reference/workflows-and-actions/dockerfile-support#user
      options: --user 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: glibc · Ubuntu
            os: ubuntu-24.04
            libc: glibc
            rootfs: ubuntu
          - title: uClibc · Buildroot
            os: ubuntu-24.04
            libc: uclibc
            rootfs: buildroot
    env:
      # 下面的 run 只用环境变量，不直接展开 matrix 字段，可在 CI 镜像中原样执行
      LIBC: ${{ matrix.libc }}
      # 构建变体，每行「例程 [板型开关]」，与 build.sh 的选项一致
      # spidev 按板型各构建一次：LUCKFOX_PICO_PLUS 切换 LCD、触摸与 SD 卡引脚和 SPI 速率；LUCKFOX_PICO_PRO_MAX（Pro 与 Max 共用一套引脚）只决定部署目录名，产物与不带板型相同；不带板型会装到入库中不存在的 _spidev_demo
      # 新增例程或板型时同步修改；漏加例程时编译前报错
      VARIANTS: |
        luckfox_pico_retinaface_facenet
        luckfox_pico_retinaface_facenet_spidev LUCKFOX_PICO_PLUS
        luckfox_pico_retinaface_facenet_spidev LUCKFOX_PICO_PRO_MAX
        luckfox_pico_yolov5
    steps:
      - name: 📤 检出本仓
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🧰 检出 uClibc 工具链（sparse）
        if: matrix.libc == 'uclibc'
        uses: actions/checkout@v7
        with:
          repository: yuangezhizao/luckfox-pico
          ref: dev
          path: luckfox-pico
          persist-credentials: false
          sparse-checkout: tools/linux/toolchain
          sparse-checkout-cone-mode: true

      - name: 🛠️ 交叉编译全部变体
        shell: bash
        run: |
          set -euo pipefail
          unset LUCKFOX_SDK_PATH GLIBC_COMPILER || true
          if [ "${LIBC}" = "uclibc" ]; then
            echo "luckfox-pico SHA=$(git -C luckfox-pico rev-parse HEAD)"
            export LUCKFOX_SDK_PATH="${GITHUB_WORKSPACE}/luckfox-pico"
            GCC="${LUCKFOX_SDK_PATH}/tools/linux/toolchain/arm-rockchip830-linux-uclibcgnueabihf/bin/arm-rockchip830-linux-uclibcgnueabihf-gcc"
            test -x "${GCC}"
            echo "gcc -print-sysroot=$("${GCC}" -print-sysroot)"
            test -z "${GLIBC_COMPILER+x}" || { echo "❌ uClibc 行不得设置 GLIBC_COMPILER"; exit 1; }
          else
            export GLIBC_COMPILER=/usr/bin/arm-linux-gnueabihf-
            test -x "${GLIBC_COMPILER}gcc"
            "${GLIBC_COMPILER}gcc" --version | head -1
            test -z "${LUCKFOX_SDK_PATH+x}" || { echo "❌ glibc 行不得设置 LUCKFOX_SDK_PATH"; exit 1; }
          fi
          # example/ 下的每个例程都要出现在 VARIANTS 中，新增例程漏加时在编译前失败，不会被静默跳过
          mapfile -t dirs < <(find example -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort)
          missing=()
          for d in "${dirs[@]}"; do
            grep -qE "^${d}([[:space:]]|$)" <<<"${VARIANTS}" || missing+=("${d}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::example/ 下的例程未加入 VARIANTS：${missing[*]}"
            exit 1
          fi
          # CMakeLists.txt 把安装目录写死为源码树内的 install/<libc>/<例程>[_plus|_pro_max]_demo/；CI 检出是一次性的，先删去其中已入库的产物，使 install/<libc>/ 只含本次构建的结果
          rm -rf "install/${LIBC}"
          failed=(); n=0
          while read -r ex board; do
            [ -n "${ex}" ] || continue
            n=$((n + 1)); name="${ex}${board:+ (${board})}"; b="build/${ex}${board:+-${board}}"
            echo "::group::${name}"
            if cmake -S . -B "${b}" -DLIBC_TYPE="${LIBC}" -DEXAMPLE_DIR="example/${ex}" -DEXAMPLE_NAME="${ex}" ${board:+"-D${board}=ON"} \
              && make -C "${b}" -j"$(nproc)" \
              && make -C "${b}" install; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::${name} 编译失败，日志见上方同名分组"
              failed+=("${name}")
            fi
          done <<<"${VARIANTS}"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "❌ ${#failed[@]}/${n} 个变体编译失败：${failed[*]}"
            exit 1
          fi
          echo "✅ ${n} 个变体编译成功"

      - name: 📏 产物清单与体积
        shell: bash
        run: |
          ls -lhR "install/${LIBC}/" || true
          du -sh "install/${LIBC}/"* 2>/dev/null || true

      - name: ${{ matrix.libc == 'glibc' && '✅ 兼容性检查（含版本上限）' || '✅ 兼容性检查（uClibc 不查版本上限）' }}
        shell: bash
        env:
          # 板上 glibc 系统（Luckfox 的 Ubuntu 22.04 固件）各库提供的最高版本，取自 jammy-updates 的 armhf 包：libc6 2.35、libstdc++6 与 libgcc-s1 12.3.0（依据与实测见 luckfox_pico_rkmpi_example 仓 CI spec §2.6：https://github.com/yuangezhizao/luckfox_pico_rkmpi_example/blob/cf2a0dbb99416858454bef9f9108a028362e75d9/docs/superpowers/specs/2026-11-17-rkmpi-example-github-actions-ci-design.md）。
          # CI 的交叉工具链来自 Ubuntu 24.04，能产生更高的版本要求，板上动态链接器会拒绝启动；改用其他 glibc 系统时按该系统的包调整。
          # 只用于 glibc 行：uClibc 产物由 SDK 工具链编译，Buildroot 固件的 libc、libstdc++ 出自同一套工具链，不做版本检查
          MAX_GLIBC: '2.35'
          MAX_GLIBCXX: '3.4.30'
          MAX_CXXABI: '1.3.13'
          MAX_GCC: '7.0.0'
        run: |
          set -euo pipefail
          if [ "${LIBC}" = "glibc" ]; then
            WANT_LIBC=libc.so.6; NOT_LIBC=libc.so.0; WANT_INTERP=/lib/ld-linux-armhf.so.3
          else
            WANT_LIBC=libc.so.0; NOT_LIBC=libc.so.6; WANT_INTERP=/lib/ld-uClibc.so.0
          fi
          err() { echo "::error file=${1}::${2}"; bad=1; }
          ver_le() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$2" ]; }  # $1 <= $2
          # $1=文件 $2=exe|lib：部署目录 lib/ 中的 .so 同样由板上动态链接器加载，只是没有 interpreter，不查这一项
          check() {
            local f=$1 kind=$2 bad=0 hdr interp needed needs p max_var max top v syms
            test -s "${f}" || { err "${f}" "产物不存在或为空"; return 1; }
            echo "${f}"
            hdr=$(readelf -h "${f}")
            grep -E 'Class|Machine' <<<"${hdr}"
            grep -q 'Class:.*ELF32' <<<"${hdr}" || err "${f}" "不是 ELF32"
            grep -q 'Machine:.*ARM' <<<"${hdr}" || err "${f}" "不是 ARM"
            if [ "${kind}" = "exe" ]; then
              interp=$(readelf -l "${f}" | sed -n 's/.*\[Requesting program interpreter: \(.*\)\]/\1/p')
              echo "interpreter: ${interp}"
              [ "${interp}" = "${WANT_INTERP}" ] || err "${f}" "interpreter 为「${interp}」，应为 ${WANT_INTERP}"
            fi
            needed=$(readelf -d "${f}" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
            echo "NEEDED: $(tr '\n' ' ' <<<"${needed}")"
            grep -qxF "${WANT_LIBC}" <<<"${needed}" || err "${f}" "NEEDED 中没有 ${WANT_LIBC}"
            if grep -qxF "${NOT_LIBC}" <<<"${needed}"; then err "${f}" "NEEDED 中有另一套 libc 的 ${NOT_LIBC}"; fi
            if [ "${LIBC}" = "glibc" ]; then
              # Version needs 即动态链接器加载时逐项核对的版本要求，任一项板上库不提供即拒绝启动
              needs=$(readelf -V "${f}" | sed -n '/Version needs section/,$p' | grep -oE '(GLIBC|GLIBCXX|CXXABI|GCC)_[0-9.]+' | sort -uV || true)
              for p in GLIBC GLIBCXX CXXABI GCC; do
                max_var="MAX_${p}"; max=${!max_var}
                top=$(grep "^${p}_[0-9]" <<<"${needs}" | sed "s/^${p}_//" | sort -V | tail -1 || true)
                echo "${p}: 最高 ${top:-无} / 上限 ${max}"
                for v in $(grep "^${p}_[0-9]" <<<"${needs}" | sed "s/^${p}_//" || true); do
                  ver_le "${v}" "${max}" && continue
                  syms=$(readelf --dyn-syms -W "${f}" | awk -v want="${p}_${v}" '{ n = $8; sub(/^[^@]*@+/, "", n); if (n == want) print $8 }' | sort -u | tr '\n' ' ')
                  err "${f}" "要求 ${p}_${v}，超过板上的 ${p}_${max}；引用它的符号：${syms:-（未找到）}"
                done
              done
            fi
            return "${bad}"
          }
          # 部署目录名与 CMakeLists.txt 的 CMAKE_INSTALL_PREFIX 规则一致
          demo_dir() {  # $1=例程 $2=板型
            case "$2" in
              LUCKFOX_PICO_PLUS) echo "install/${LIBC}/${1}_plus_demo" ;;
              LUCKFOX_PICO_PRO_MAX) echo "install/${LIBC}/${1}_pro_max_demo" ;;
              "") echo "install/${LIBC}/${1}_demo" ;;
              *) echo "::error::未知板型 $2" >&2; return 1 ;;
            esac
          }
          failed=(); n=0
          while read -r ex board; do
            [ -n "${ex}" ] || continue
            n=$((n + 1)); name="${ex}${board:+ (${board})}"; dir=$(demo_dir "${ex}" "${board}")
            echo "::group::${name}"
            ok=1
            check "${dir}/${ex}" exe || ok=0
            for so in "${dir}"/lib/*.so; do
              [ -e "${so}" ] || continue
              check "${so}" lib || ok=0
            done
            echo "::endgroup::"
            [ "${ok}" = 1 ] || failed+=("${name}")
          done <<<"${VARIANTS}"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "❌ ${#failed[@]}/${n} 个变体未通过兼容性检查：${failed[*]}"
            exit 1
          fi
          echo "✅ ${n} 个变体通过兼容性检查"

      - name: 🔐 生成 SHA256 校验和
        shell: bash
        run: |
          set -euo pipefail
          cd "install/${LIBC}"
          # 部署目录中有 lib/、model/ 子目录，按相对路径递归计算
          mapfile -t files < <(find . -type f ! -name 'SHA256SUMS' -printf '%P\n' | LC_ALL=C sort)
          sha256sum -- "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: 📦 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: luckfox_pico_rknn_example_${{ matrix.libc }}-${{ matrix.rootfs }}_on-${{ matrix.os }}
          if-no-files-found: error
          path: install/${{ matrix.libc }}/
